name: Build and deploy to GitHub Pages

# Disabled 2026-08-25. Hosting is Hostinger, not GitHub Pages. This workflow was
# still building the site with the retired python builder and publishing a full
# duplicate to connorblades.github.io on every push. That copy has no /api/submit
# behind it, so its enquiry form returned 405 and any lead reaching it was lost.
# Left in place rather than deleted so the history is obvious, but it now only
# runs if someone starts it by hand.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build site
        run: python3 build.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
